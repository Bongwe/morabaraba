services:
  backend:
    image: ${IMAGE_PREFIX:-morabaraba}/backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9092:9092"
    networks:
      - morabaraba-net

  frontend:
    image: ${IMAGE_PREFIX:-morabaraba}/frontend:latest
    build:
      context: ./morabaraba-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - morabaraba-net

  wild-dog:
    image: ${IMAGE_PREFIX:-morabaraba}/wild-dog:latest
    build:
      context: ./obomvu-wild-dog
      dockerfile: Dockerfile
    ports:
      - "9094:80"
    networks:
      - morabaraba-net

networks:
  morabaraba-net:
    driver: bridge
