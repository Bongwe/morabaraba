server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Unity fallback-wrapped assets ("UnityWeb Compressed Content (...)" header)
    # must NOT be served with Content-Encoding headers.
    location ~ .+\.(data|symbols\.json)\.(br|gz)$ {
        default_type application/octet-stream;
    }
    location ~ .+\.js\.(br|gz)$ {
        default_type application/javascript;
    }
    location ~ .+\.wasm\.(br|gz)$ {
        default_type application/wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
