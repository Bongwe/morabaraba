server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # This Unity build requests .gz files and expects browser-side decompression.
    # Serve .gz files with Content-Encoding:gzip so the browser inflates them.
    location ~ .+\.(data|symbols\.json)\.gz$ {
        add_header Content-Encoding gzip;
        default_type application/octet-stream;
    }
    location ~ .+\.js\.gz$ {
        add_header Content-Encoding gzip;
        default_type application/javascript;
    }
    location ~ .+\.wasm\.gz$ {
        add_header Content-Encoding gzip;
        default_type application/wasm;
    }

    # Keep .br files without Content-Encoding unless the build outputs raw
    # brotli streams and is configured for server-side content encoding.
    location ~ .+\.(data|symbols\.json)\.br$ {
        default_type application/octet-stream;
    }
    location ~ .+\.js\.br$ {
        default_type application/javascript;
    }
    location ~ .+\.wasm\.br$ {
        default_type application/wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
