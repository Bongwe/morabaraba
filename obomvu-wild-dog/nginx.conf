server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # --- Unity WebGL precompressed assets ---
    # Unity can ship Build/ files compressed as .br (Brotli) or .gz (Gzip).
    # When the "decompression fallback" build option is OFF, Unity's loader
    # requests these files directly and the server must set Content-Encoding
    # itself (nginx:alpine has no brotli module, so we just serve the file
    # as-is with the right header — the browser inflates it).

    location ~ .+\.(data|symbols\.json)\.br$ {
        add_header Content-Encoding br;
        default_type application/octet-stream;
    }
    location ~ .+\.js\.br$ {
        add_header Content-Encoding br;
        default_type application/javascript;
    }
    location ~ .+\.wasm\.br$ {
        add_header Content-Encoding br;
        default_type application/wasm;
    }

    location ~ .+\.(data|symbols\.json)\.gz$ {
        add_header Content-Encoding gzip;
        default_type application/octet-stream;
    }
    location ~ .+\.js\.gz$ {
        add_header Content-Encoding gzip;
        default_type application/javascript;
    }
    location ~ .+\.wasm\.gz$ {
        add_header Content-Encoding gzip;
        default_type application/wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
